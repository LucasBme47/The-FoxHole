#!/usr/sbin/nft -f
#
# TheFoxHole V3 nftables ruleset  ->  /etc/nftables.conf on the Pi
# Check syntax:  sudo nft -c -f /etc/nftables.conf
# Apply:         sudo nft -f /etc/nftables.conf
#
# Interface roles (V3):
#   eth0 = onboard NIC = WAN (DHCP from the TP-Link router, 192.168.0.x)
#   eth1 = USB dongle  = LAN (10.0.0.1/24, Pi-hole DHCP + DNS)
#
# IMPORTANT: nftables requires explicit protocol + direction on port rules.
# Write "udp dport 67", NOT "udp port 67" or just "port 67".

flush ruleset

# EXAMPLE VALUES - change the addresses below to match your own network.
# The same addresses also appear in local.rules, foxhole_triage.py and dashboard-internet.

define WAN    = "eth0"
define LAN    = "eth1"
define LAPTOP = 10.0.0.2     # AdminPC       (management host)
define GAMESRV = 10.0.0.18    # GameServer        (Minecraft server, home network only)
define DASH   = 10.0.0.20    # DashboardPC  (Dashboard Viewer, no internet by default)
define WIFI_NET = 192.168.0.0/24   # the router's own network: in-house Wi-Fi devices

table inet filter {

    # BLOCKED_IPS: triage daemon adds attacker IPs here via "nft add element"
    # Entries auto-expire after 30 minutes - no manual cleanup needed
    set BLOCKED_IPS {
        type ipv4_addr
        flags dynamic, timeout
        timeout 30m
    }

    # DASH_INTERNET: empty = Dashboard Viewer has NO internet (the default, and the
    # state after every reboot / ruleset reload). The "dashboard-internet on|off"
    # command adds/removes the Dashboard Viewer's address here.
    set DASH_INTERNET {
        type ipv4_addr
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Drop any IP that the triage daemon has auto-blocked
        ip saddr @BLOCKED_IPS drop

        # Always allow loopback
        iifname "lo" accept

        # Allow replies to connections we initiated
        ct state established,related accept

        # Allow ping from LAN for diagnostics
        iifname $LAN icmp type echo-request accept

        # SMB (NAS) - queue to Suricata for inspection
        iifname $LAN tcp dport { 139, 445 } queue to 0

        # SSH - laptop only, rate-limited to 10 new connections/minute
        iifname $LAN ip saddr $LAPTOP tcp dport 22 ct state new limit rate 10/minute burst 5 packets accept

        # DNS - all LAN devices can use Pi-hole
        iifname $LAN udp dport 53 accept
        iifname $LAN tcp dport 53 accept

        # DHCP - LAN devices request addresses from Pi-hole
        iifname $LAN udp dport 67 accept

        # NTP - Pi-hole's built-in time server (the Dashboard Viewer has no internet time source)
        iifname $LAN udp dport 123 accept

        # Pi-hole admin UI - laptop only
        iifname $LAN ip saddr $LAPTOP tcp dport 8080 accept

        # Grafana UI - laptop and Dashboard Viewer
        iifname $LAN ip saddr { $LAPTOP, $DASH } tcp dport 3000 accept
        # Prometheus UI - laptop only
        iifname $LAN ip saddr $LAPTOP tcp dport 9090 accept
        # Open WebUI (chat with the LLM) - laptop only
        iifname $LAN ip saddr $LAPTOP tcp dport 8081 accept

        # Minecraft is home-network only. Nothing on the WAN side should ever knock on
        # these ports; log it if it happens (the packet is then dropped by policy).
        iifname $WAN tcp dport 25565 limit rate 6/minute log prefix "FOXHOLE-MC-WAN "
        iifname $WAN udp dport 19132 limit rate 6/minute log prefix "FOXHOLE-MC-WAN "
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Auto-blocked addresses: nothing to them, nothing from them
        ip saddr @BLOCKED_IPS drop
        ip daddr @BLOCKED_IPS drop

        # Dashboard Viewer: internal monitoring only. No internet unless switched on.
        iifname $LAN ip saddr $DASH ip saddr != @DASH_INTERNET drop
        iifname $WAN ip daddr $DASH ip daddr != @DASH_INTERNET drop

        # Everything else that is forwarded goes to Suricata (queue 0), which makes
        # the final accept/drop decision. Fail-closed: if Suricata is down, nothing forwards.
        #   LAN -> WAN: all outbound traffic
        #   WAN -> LAN: only replies to connections the LAN started (no inbound forwards)
        iifname $LAN oifname $WAN queue to 0
        iifname $WAN oifname $LAN ct state established,related queue to 0
        iifname $LAN oifname $LAN queue to 0

        # Minecraft for in-house Wi-Fi devices only: new connections from the router's
        # network to GameServer's two Minecraft ports (see the nat prerouting chain below).
        # Internet traffic can never match: it does not carry a 192.168.0.x source address.
        iifname $WAN oifname $LAN ip saddr $WIFI_NET ip daddr $GAMESRV tcp dport 25565 ct state new queue to 0
        iifname $WAN oifname $LAN ip saddr $WIFI_NET ip daddr $GAMESRV udp dport 19132 ct state new queue to 0
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Wi-Fi devices connect to the Pi's router-side address (its eth0 address) and are
        # handed on to the Minecraft server on GameServer. Wi-Fi sources only.
        iifname $WAN ip saddr $WIFI_NET tcp dport 25565 dnat to $GAMESRV
        iifname $WAN ip saddr $WIFI_NET udp dport 19132 dnat to $GAMESRV
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # NAT: replace source IP with the Pi's WAN IP for all outbound traffic
        oifname $WAN masquerade
    }
}
